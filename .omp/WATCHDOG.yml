# Advisor roster for the Madeira fork. Applies to sessions with an advisor: the native `worker` and
# `ui-worker` agents opt in via `advisor: true`. Guidance: .omp/WATCHDOG.md. Docs: docs/fork/PARALLEL.md.
# Cost: an advisor re-reads its whole context on every review, so cadence drives usage.
maxNotesPerUpdate: 2
advisors:
  - name: Lead rules
    model: "@advisor"
    reviewMode: turn
    reviewInterval: 4
    syncBacklog: off
    instructions: |
      Enforce the task's file set and the worker rules. Silence is the default; one note per real problem.
